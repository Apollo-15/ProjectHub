<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="output.css">
    <link rel="stylesheet" th:href="@{/css/themeswitcher.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/image-slider.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/daisyui/4.12.23/full.css"/>
    <script src="https://cdn.jsdelivr.net/npm/daisyui@1.12.0/dist/full.js"></script>
</head>
<body class="h-screen">
<style>
    html, body {
        height: 100%;
        margin: 0;
        background-color: var(--bg) !important;
    }
</style>

<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mx-auto p-6">
    <div class="border-4 rounded-3xl p-6 " style="background-color: var(--surface); border-color: var(--border); box-shadow: 0 5px 30px var(--text-secondary);">
        <div class="carousel w-full relative">
            <div id="slide1" class="carousel-item relative w-full">
                <img src="images/forsite_barkcraft2.0.png" alt="Image 1" class="image rounded-3xl w-full" />
                <div class="absolute left-5 right-5 top-1/2 flex -translate-y-1/2 transform justify-center items-center flex-col slide-animation">
                    <p class="text-white text-xl mb-4">Текст над кнопкой</p>
                    <button class="btn-link text-white transition-opacity opacity-0 hover:opacity-100" onclick="window.location.href='https://link1.com'">Перейти</button>
                </div>
            </div>

            <div id="slide2" class="carousel-item relative w-full">
                <img src="images/forsite_barkcraft1.2.png" alt="Image 2" class="image rounded-3xl w-full" />
                <div class="absolute left-5 right-5 top-1/2 flex -translate-y-1/2 transform justify-center items-center flex-col slide-animation">
                    <p class="text-white text-xl mb-4">Текст над кнопкой</p>
                    <button class="btn-link text-white transition-opacity opacity-0 hover:opacity-100" onclick="window.location.href='https://link2.com'">Перейти</button>
                </div>
            </div>

            <div id="slide3" class="carousel-item relative w-full">
                <img src="images/forsite_minefear.png" alt="Image 3" class="image rounded-3xl w-full" />
                <div class="absolute left-5 right-5 top-1/2 flex -translate-y-1/2 transform justify-center items-center flex-col slide-animation">
                    <p class="text-white text-xl mb-4">Текст над кнопкой</p>
                    <button class="btn-link text-white transition-opacity opacity-0 hover:opacity-100" onclick="window.location.href='https://link3.com'">Перейти</button>
                </div>
            </div>
        </div>




        <section class="about-me mt-10">
            <h2 class="text-2xl font-semibold">About Me</h2>
            <p class="mt-2">
                I’m an indie developer
            </p>
        </section>

        <section class="featured-project mt-10">
            <h2 class="text-2xl font-semibold">Featured Project</h2>
            <div class="card mt-4 p-4 border rounded-lg shadow-md">
                <h3 class="text-xl font-bold">Project Name</h3>
                <p class="mt-2">Short description of the featured project. Check out more on the Projects page.</p>
                <a href="/projects" class="text-blue-500 underline mt-4 inline-block">View All Projects</a>
            </div>
        </section>
    </div>
</div>

<div th:replace="fragments/footer :: footer"></div>
<script th:src="@{/js/navbar.js}"></script>
<script th:src="@{/js/image-slider.js}"></script>
</body>


</html>
